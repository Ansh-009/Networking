<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Computer Networks Lab</title>
<style>
:root{--bg:#f2f6f4;--fg:#13201e;--mut:#506460;--card:#fff;--line:#c3d3ce;--a:#0a7f73;--b:#cf7f00;--c:#c8423b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1716;--fg:#e6f0ed;--mut:#9ab2ac;--card:#162422;--line:#2f4743;--a:#3cc4b3;--b:#f0aa3a;--c:#f0716a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1716;--fg:#e6f0ed;--mut:#9ab2ac;--card:#162422;--line:#2f4743;--a:#3cc4b3;--b:#f0aa3a;--c:#f0716a;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(circle at 15% -5%,color-mix(in srgb,var(--a) 28%,transparent),transparent 45%),radial-gradient(circle at 95% 0,color-mix(in srgb,var(--b) 22%,transparent),transparent 40%),var(--bg);color:var(--fg);font:16px/1.55 Georgia,"Times New Roman",serif}
header{padding:20px 16px 8px;max-width:1180px;margin:auto}
h1{font-size:clamp(1.5rem,5vw,2.5rem);margin:0;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
header p{margin:4px 0 0;color:var(--mut)}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;max-width:1180px;margin:auto;scrollbar-width:thin}
button{font:600 14px system-ui,sans-serif;border:1.5px solid var(--line);background:var(--card);color:var(--fg);padding:8px 13px;border-radius:8px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--a)}
button:focus-visible{outline:3px solid var(--b);outline-offset:2px}
button[aria-pressed="true"]{background:var(--a);color:#fff;border-color:var(--a)}
main{max-width:1180px;margin:auto;padding:4px 16px 40px}
h2{margin:8px 0 2px;font-size:1.3rem}
.lead{margin:0 0 10px;color:var(--mut)}
.card{background:linear-gradient(color-mix(in srgb,var(--line) 45%,transparent) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,color-mix(in srgb,var(--line) 45%,transparent) 1px,transparent 1px) 0 0/28px 28px,var(--card);border:1.5px solid var(--a);border-radius:14px;padding:6px;box-shadow:0 0 26px color-mix(in srgb,var(--a) 28%,transparent)}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font:12px system-ui,sans-serif;text-anchor:middle}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.cap{min-height:3em;margin:6px 0;padding:10px 12px;border-left:4px solid var(--b);background:var(--card);border-radius:4px}
.ex{border:1.5px dashed var(--a);border-radius:10px;padding:10px 14px;margin-top:10px;font-size:.95rem}
.ex b{color:var(--a)}
input,select{font:600 14px system-ui,sans-serif;padding:6px;border-radius:6px;border:1.5px solid var(--line);background:var(--card);color:var(--fg)}
.u{color:var(--c);font-weight:700}.d{color:var(--a);font-weight:700}.p{color:var(--b);font-weight:700}
svg circle.nd{filter:drop-shadow(0 0 5px var(--a))}
.pulse{fill:none;stroke:var(--a);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:pl 2.4s ease-out infinite;pointer-events:none}
@keyframes pl{from{transform:scale(1);opacity:.8}to{transform:scale(2.2);opacity:0}}
line.flow{stroke:color-mix(in srgb,var(--a) 60%,var(--line));stroke-dasharray:3 11;animation:fw 1s linear infinite}
@keyframes fw{to{stroke-dashoffset:-14}}
.tr{animation:tf .7s forwards;pointer-events:none}
@keyframes tf{to{opacity:0;transform:scale(.2)}}
.pk{filter:drop-shadow(0 0 7px currentColor)}
nav button,.ctl button{transition:transform .15s,box-shadow .15s}
button:hover{transform:translateY(-2px);box-shadow:0 4px 14px color-mix(in srgb,var(--a) 35%,transparent)}
.grid{display:grid;gap:16px;align-items:start}
@media(min-width:980px){.grid{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}.grid aside{position:sticky;top:12px}}
.df{margin-top:10px}.df h3{margin:0 0 6px;font:700 13px system-ui,sans-serif;color:var(--mut)}
.t{padding:8px 11px;margin-bottom:6px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;font-size:.9rem;transition:all .35s}
.t b{display:block;color:var(--a);font-family:system-ui,sans-serif}
.t.on{border-color:var(--b);box-shadow:0 0 0 3px color-mix(in srgb,var(--b) 25%,transparent);transform:translateX(5px)}
.in{animation:ent .5s ease}@keyframes ent{from{opacity:0;transform:translateY(12px)}}
@media(max-width:640px){svg text{font-size:15px}main{padding:4px 12px 32px}.ctl button{flex:1 1 auto}h2{font-size:1.15rem}}
@media(pointer:coarse){button{padding:11px 15px}}
@media (prefers-reduced-motion:reduce){.pulse,line.flow,.in{animation:none}}
</style></head><body>
<header><h1>Computer Networks Lab</h1><p>Class 12 CS, CBSE. Har tab mein animation chalao aur concept dekho.</p></header>
<nav id="nav" aria-label="Chapters"></nav>
<main id="main"></main>
<script>
const NS='http://www.w3.org/2000/svg',A='var(--a)',B='var(--b)',C='var(--c)';
const $=s=>document.querySelector(s),main=$('#main');
let busy=false;
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
function txt(p,x,y,s,a={}){const t=el('text',{x,y,...a},p);t.textContent=s;return t}
function node(s,x,y,l,o={}){const g=el('g',{},s);el('circle',{class:'pulse',cx:x,cy:y,r:o.r||15,style:'animation-delay:'+(Math.random()*2.4)+'s'},g);el('circle',{class:'nd',cx:x,cy:y,r:o.r||15,fill:o.fill||'var(--card)',stroke:o.stroke||A,'stroke-width':2},g);const t=txt(g,x,y+4,l,{'font-weight':700,'font-size':o.fs||11});if(o.fill)t.style.fill='#fff';return g}
function line(s,a,b,o={}){const e=el('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:o.c||'var(--line)','stroke-width':o.w||3,'stroke-linecap':'round'},s);if(o.d)e.setAttribute('stroke-dasharray',o.d);else if(!o.c)e.setAttribute('class','flow');return e}
function pkt(s,pts,o={}){return new Promise(res=>{const L=[0];for(let i=1;i<pts.length;i++)L.push(L[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));const T=L[L.length-1],dur=o.dur||T*4,g=el('g',{},s),z=o.z||8;
el('rect',{class:'pk',x:-z,y:-z,width:2*z,height:2*z,rx:4,fill:o.c||B,style:'color:'+(o.c||B)},g);if(o.l){const t=txt(g,0,4,o.l,{'font-weight':700,'font-size':11});t.style.fill='#fff'}
let lt=0;const t0=performance.now();(function f(n){const k=Math.min(1,(n-t0)/dur),d=(k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2)*T;let i=1;while(i<L.length-1&&L[i]<d)i++;const q=(d-L[i-1])/((L[i]-L[i-1])||1);const X=pts[i-1][0]+(pts[i][0]-pts[i-1][0])*q,Y=pts[i-1][1]+(pts[i][1]-pts[i-1][1])*q;g.setAttribute('transform',`translate(${X},${Y})`);if(n-lt>40){lt=n;const tq=el('circle',{class:'tr',cx:X,cy:Y,r:z*.7,fill:o.c||B,style:'transform-box:fill-box;transform-origin:center'});s.insertBefore(tq,g);tq.onanimationend=()=>tq.remove()}if(k<1)requestAnimationFrame(f);else{const e=pts[pts.length-1],rp=el('circle',{class:'pulse',cx:e[0],cy:e[1],r:z+8,style:'animation-iteration-count:1;stroke:'+(o.c||B)},s);rp.onanimationend=()=>rp.remove();g.remove();res()}})(t0)})}
function stage(title,intro){main.className='';void main.offsetWidth;main.className='in';main.innerHTML=`<h2>${title}</h2><p class="lead">${intro}</p><div class="grid"><div><div class="card"><svg id="s" viewBox="0 0 600 320" role="img" aria-label="${title}"></svg></div><div class="ctl" id="c"></div></div><aside><p id="cap" class="cap" aria-live="polite"></p><div class="df" id="df"></div><div class="ex" id="ex"></div></aside></div>`;busy=false;return $('#s')}
const hl=i=>document.querySelectorAll('#df .t').forEach((t,j)=>t.classList.toggle('on',i==j));
const defs=l=>{$('#df').innerHTML='<h3>Key terms (click karo)</h3>'+l.map((d,i)=>`<div class="t" data-i="${i}"><b>${d[0]}</b>${d[1]}</div>`).join('');$('#df').onclick=e=>{const t=e.target.closest('.t');if(t)hl(+t.dataset.i)};hl(0)};
const cap=t=>$('#cap').textContent=t,ex=h=>$('#ex').innerHTML=h;
function btn(l,f,sel){const b=document.createElement('button');b.textContent=l;b.onclick=f;if(sel!==undefined)b.setAttribute('aria-pressed',sel);$('#c').appendChild(b);return b}
function pick(bs,i){bs.forEach((b,j)=>b.setAttribute('aria-pressed',i==j))}
const R=(cx,cy,r,n)=>Array.from({length:n},(_,i)=>{const a=(-90+360*i/n)*Math.PI/180;return[cx+r*Math.cos(a),cy+r*Math.sin(a)]});
const mid=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];

/* 1. Network -> Internet */
function tNet(){const s=stage('Network se Internet','Teen steps mein dekho: akele computers se Internet kaise banta hai.');defs([['Standalone PC','Akela computer jo kisi se connected nahi. Na sharing, na data flow.'],['Network','2 ya zyada devices ka wired/wireless medium se connection, resources aur information share karne ke liye.'],['Internet','Network of Networks: alag-alag networks ka global interconnection.'],['Node','Network ka active device: computer, printer, mobile.'],['Link','Wo medium (wire ya wireless) jisse data travel karta hai.']]);let st=0;
const G=[[120,100],[480,100],[300,235]],O=[[-50,-28],[45,-36],[0,32]];
const caps=['Standalone PC: na access, na sharing, na data flow. Sab isolated hain.','Links se jude to Network bana: nodes + link. Ab files, printer aur messages share ho sakte hain.','Jab alag-alag networks aapas mein jude, tab bana Internet: Network of Networks.'];
const P=G.map(g=>O.map(o=>[g[0]+o[0],g[1]+o[1]]));
async function go(d){if(busy)return;st=Math.max(0,Math.min(2,st+d));hl(st);s.innerHTML='';cap(caps[st]);
if(st>=2){[[0,1],[1,2],[0,2]].forEach(([i,j])=>line(s,G[i],G[j],{c:B,w:4}));el('ellipse',{cx:300,cy:165,rx:285,ry:150,fill:'none',stroke:B,'stroke-dasharray':'6 6'},s);txt(s,300,26,'INTERNET',{'font-weight':700,'font-size':15})}
G.forEach((g,k)=>{const p=P[k];if(st>=1){line(s,p[0],p[1]);line(s,p[1],p[2]);line(s,p[0],p[2]);el('circle',{cx:g[0],cy:g[1],r:68,fill:'none',stroke:A,'stroke-dasharray':'4 4'},s);txt(s,g[0],g[1]+66,'Network '+(k+1))}
else txt(s,g[0],g[1]+66,'akela');p.forEach(q=>node(s,q[0],q[1],'PC',{stroke:st?A:'var(--mut)'}))});
busy=true;
if(st==1)await Promise.all(P.map(p=>pkt(s,[p[0],p[1],p[2]],{dur:1400})));
if(st==2){await pkt(s,[P[0][0],G[0],G[1],P[1][0]],{dur:2200});await pkt(s,[P[1][1],G[1],G[2],P[2][2]],{dur:2200})}
busy=false}
btn('Pichla step',()=>go(-1));btn('Agla step',()=>go(1));go(0);
ex('<b>Exam point:</b> Node = koi bhi active device (computer, printer, mobile). Link = wired ya wireless medium. Advantages: resource sharing, communication, reliability, cost saving.')}

/* 2. Types */
function tTypes(){const s=stage('Network ke Types','Ring par click karo: PAN, LAN, MAN ya WAN.');defs([['WAN (Wide Area Network)','Country ya continent tak phaila network. Example: Internet.'],['MAN (Metropolitan Area Network)','Ek poore city ko cover karta hai. Example: cable TV network.'],['LAN (Local Area Network)','Ek building ya campus (~1 km) ka fast network. Example: school, office.'],['PAN (Personal Area Network)','Apne aas-paas (~10 m) ke devices ka network. Example: Bluetooth.']]);
const D=[['WAN',152,'Country/continent. Example: Internet. Costly, slower, zyada errors.'],['MAN',116,'Poora city. Example: cable TV network.'],['LAN',80,'Up to ~1 km: school, office, building. Wi-Fi/Ethernet. Fast, low error.'],['PAN',42,'~10 m se kam: apna personal area. Bluetooth, USB tethering.']];
const rs=[];
function sel(i){hl(i);rs.forEach((r,j)=>r.setAttribute('fill',j==i?'var(--a)':'var(--card)'));rs.forEach((r,j)=>r.setAttribute('fill-opacity',j==i?.25:1));cap(D[i][0]+': '+D[i][2])}
D.forEach((d,i)=>{const c=el('circle',{cx:300,cy:165,r:d[1],fill:'var(--card)',stroke:A,'stroke-width':2.5,style:'cursor:pointer',tabindex:0,role:'button','aria-label':d[0]},s);c.onclick=()=>sel(i);c.onkeydown=e=>{if(e.key=='Enter')sel(i)};rs.push(c);txt(s,300,165-d[1]+(i==3?50:20),d[0],{'font-weight':700,'font-size':i==3?16:14,'pointer-events':'none'})});
txt(s,500,60,'Range badhti hai',{'font-weight':700});txt(s,500,76,'cost badhti hai');txt(s,500,260,'Speed ghatti hai');txt(s,500,276,'errors badhte hain');
sel(3);
ex('<b>Exam point:</b> PAN (<10 m) &lt; LAN (~1 km) &lt; MAN (city) &lt; WAN (country/continent). Internet ek WAN hai.')}

/* 3. Media */
function tMedia(){const s=stage('Transmission Media','Data ke chalne ka raasta. Media chuno aur Data bhejo dabao.');defs([['Twisted Pair','Do insulated copper wires ki twisted jodi. UTP (unshielded) ya STP (shielded).'],['Coaxial Cable','Copper core + shield. Cable TV mein, noise resistance achhi.'],['Optical Fibre','Glass strands, light pulses se data. Sabse fast.'],['Radio waves','Wireless, long range, low data rate.'],['Microwave','Wireless, line-of-sight: satellite aur radar.'],['Infrared','Short range wireless, deewar cross nahi karta.']]);
const M={'Twisted Pair':['g',.18,'#8a6','Sasta, LAN aur telephone mein. Do wires twisted hoti hain, isse interference cancel hota hai. Types: STP, UTP.'],'Coaxial':['g',.3,'#a63','Cable TV mein. Noise resistance achhi. Thinnet ~185 m, Thicknet ~500 m.'],'Optical Fibre':['g',1,'#4ae','Light pulses (TIR). Sabse fast, long distance, electromagnetic interference nahi.'],'Radio waves':['w',.1,'','Long range, FM radio/TV. Data rate low. Wireless hone se guided se slow.'],'Microwave':['w',.15,'','Satellite aur radar communication. Wireless (unguided).'],'Infrared':['w',.08,'','Short range, deewar cross nahi karta, TV remote. Room ke andar secure.']};
let cur='Twisted Pair';const names=Object.keys(M),bs=[];
function draw(){hl(names.indexOf(cur));s.innerHTML='';const m=M[cur];if(m[0]=='g'){line(s,[85,160],[515,160],{c:m[2],w:cur=='Optical Fibre'?5:11});txt(s,300,215,'Guided: wire ke andar',{'font-weight':700});if(cur=='Twisted Pair'){for(let x=110;x<500;x+=30)line(s,[x,152],[x+15,168],{c:'#fff',w:2})}}
else{line(s,[85,160],[515,160],{c:'var(--line)',w:2,d:'3 8'});[28,48,68].forEach(r=>el('path',{d:`M${85+r*.5} ${160-r} A${r} ${r} 0 0 1 ${85+r*.5} ${160+r}`,fill:'none',stroke:A,'stroke-width':2},s));txt(s,300,215,'Unguided: hawa mein, koi wire nahi',{'font-weight':700})}
node(s,60,160,'Tx',{r:24,fill:A});node(s,540,160,'Rx',{r:24,fill:B});cap(cur+': '+m[3])}
names.forEach((n,i)=>bs.push(btn(n,()=>{if(busy)return;cur=n;pick(bs,i);draw()},i==0)));
btn('Data bhejo',async()=>{if(busy)return;busy=true;const m=M[cur],d=4200*(1-.85*m[1]);
if(cur=='Optical Fibre'){await Promise.all([0,1,2,3,4].map(i=>new Promise(r=>setTimeout(r,i*130)).then(()=>pkt(s,[[85,160],[515,160]],{dur:d,z:5,c:'#fff'}))))}else await pkt(s,[[85,160],[515,160]],{dur:d});busy=false});
draw();ex('<b>Exam point:</b> Guided (wired): twisted pair, coaxial, optical fibre. Unguided (wireless): radio waves, microwave, infrared, Bluetooth, satellite. Fibre sabse fast hai.')}

/* 4. Topology */
function tTopo(){const s=stage('Network Topologies','Topology = nodes ki arrangement. Topology chuno, Data bhejo, phir Fault daalo.');defs([['Bus','Saare nodes ek hi backbone cable se jude. Backbone fail = network down.'],['Star','Sab nodes central hub/switch se. Hub fail = sab band.'],['Ring','Har node do nodes se jude, circle mein. Token passing, no collision.'],['Mesh','Har node har node se jura. Cables = n(n-1)/2. Sabse robust.'],['Tree','Hierarchical (Star + Bus). Bade networks mein.']]);
const star=R(300,160,115,5),ring=R(300,160,110,6),mesh=R(300,160,115,5),xs=[110,230,350,470];
const T={
Bus:()=>{const n=[],l=[[[60,160],[540,160]]];xs.forEach(x=>{n.push([x,60],[x,260]);l.push([[x,60],[x,160]],[[x,160],[x,260]])});return{n,l,r:[[110,60],[110,160],[290,160],[470,160],[470,260]],f:2,i:'Ek single backbone. Install easy, sasta.',b:'Backbone kata to poora network band: single point of failure.'}},
Star:()=>({n:[...star,[300,160,'Hub']],l:star.map(p=>[p,[300,160]]),r:[star[0],[300,160],star[2]],f:1,i:'Sab nodes ek central hub se. Centralized control, reliable.',b:'Hub kharab to sab band. Par ek node kharab ho to baaki chalte hain.'}),
Ring:()=>({n:ring,l:ring.map((p,i)=>[p,ring[(i+1)%6]]),r:[ring[0],ring[1],mid(ring[1],ring[2]),ring[2],ring[3]],f:2,i:'Har node do nodes se jud kar circle banata hai. Token passing, no collision.',b:'Ek break aaya aur poora network down.'}),
Mesh:()=>{const l=[];mesh.forEach((p,i)=>mesh.forEach((q,j)=>{if(j>i)l.push([p,q])}));return{n:mesh,l,r:[mesh[0],mid(mesh[0],mesh[2]),mesh[2]],alt:[mesh[0],mesh[1],mesh[2]],f:1,i:'Har node har node se jura hua. Sabse robust, par wiring mehngi.',b:'Ek link tuta to bhi data doosre raaste se pahunch gaya. Isliye robust hai.'}},
Tree:()=>{const c=[[170,150],[430,150]],lf=[[100,260],[240,260],[360,260],[500,260]],rt=[300,50];return{n:[[...rt,'Root'],...c,...lf],l:[[rt,c[0]],[rt,c[1]],[c[0],lf[0]],[c[0],lf[1]],[c[1],lf[2]],[c[1],lf[3]]],r:[lf[0],c[0],rt,c[1],lf[3]],f:2,i:'Hierarchical (Star + Bus). Bade networks mein.',b:'Upar ka node kharab to neeche ki branches kat jaati hain.'}}};
let cur='Bus',bad=false;const names=Object.keys(T),bs=[];
function draw(){hl(names.indexOf(cur));s.innerHTML='';const t=T[cur]();t.l.forEach(q=>line(s,q[0],q[1],{c:bad&&t.alt?'var(--line)':'var(--line)'}));
t.n.forEach(p=>node(s,p[0],p[1],p[2]||'',{r:p[2]?21:14}));const r=t.r;node(s,r[0][0],r[0][1],'S',{fill:A,r:14});const e=r[r.length-1];node(s,e[0],e[1],'R',{fill:B,r:14});
if(bad){const f=r[t.f];line(s,[f[0]-9,f[1]-9],[f[0]+9,f[1]+9],{c:C,w:5});line(s,[f[0]-9,f[1]+9],[f[0]+9,f[1]-9],{c:C,w:5})}
cap(cur+': '+t.i+(bad?' (Fault ON: lal X jahan kharabi hai)':''))}
names.forEach((n,i)=>bs.push(btn(n,()=>{if(busy)return;cur=n;pick(bs,i);draw()},i==0)));
btn('Data bhejo',async()=>{if(busy)return;busy=true;draw();const t=T[cur](),ok=!bad||t.alt;const pts=!bad?t.r:t.alt||t.r.slice(0,t.f+1);if(cur=='Ring'&&!bad){cap('Ring mein token ghoomta hai: jiske paas token, wahi data bhej sakta hai.');await pkt(s,[...ring,ring[0]],{l:'T',c:C,dur:2800,z:9});cap('Token mil gaya, ab data bheja ja raha hai...')}await pkt(s,pts,{dur:2600});
cap(ok?(bad?t.b:'Data S se R tak pahunch gaya.'):t.b);busy=false});
btn('Fault daalo / hatao',()=>{if(busy)return;bad=!bad;draw()});
draw();ex('<b>Mesh cables = n(n-1)/2.</b> Nodes: <input id="n" type="number" min="2" max="50" value="5" style="width:70px"> cables = <b id="o">10</b><br><b>Yaad rakho:</b> Bus = single backbone, Star = hub, Ring = token passing, Mesh = sabse robust, Tree = hierarchical.');
$('#n').oninput=e=>{const n=+e.target.value;$('#o').textContent=n>1?n*(n-1)/2:0}}

/* 5. Devices */
function tDev(){const s=stage('Network Devices','Hub, Switch, Router aur Gateway ka farak dekho. A se C ko message bhejo.');defs([['Hub','Dumb device: data sab ports par broadcast karta hai.'],['Switch','Intelligent device: MAC address dekh kar sirf sahi port par bhejta hai.'],['Router','Alag networks ko jodta hai aur packets ka best path chunta hai.'],['Gateway','Dissimilar networks ko jodta hai, protocols translate karta hai.'],['Repeater','Weak signal ko amplify/regenerate karta hai (>100 m par).'],['Modem','Modulator-Demodulator: analog aur digital signal ke beech converter.'],['NIC / Ethernet card','PC ko network se jodta hai, isme MAC address hota hai.'],['RJ45','8-pin connector jo Ethernet cable ke end par lagta hai.']]);
let cur='Hub';const names=['Hub','Switch','Router','Gateway'],bs=[];
const PC={A:[90,70],B:[90,250],C:[510,70],D:[510,250]},H=[300,160],mac={A:'AA',B:'BB',C:'CC',D:'DD'};
function draw(){hl(names.indexOf(cur));s.innerHTML='';const two=cur=='Router'||cur=='Gateway';
if(two){el('rect',{x:20,y:20,width:230,height:280,rx:14,fill:'none',stroke:A,'stroke-dasharray':'5 5'},s);el('rect',{x:350,y:20,width:230,height:280,rx:14,fill:'none',stroke:B,'stroke-dasharray':'5 5'},s);txt(s,135,40,cur=='Router'?'Network 1 (LAN)':'Network X (protocol X)');txt(s,465,40,cur=='Router'?'Network 2 (WAN)':'Network Y (protocol Y)')}
Object.keys(PC).forEach(k=>{line(s,PC[k],H);});
Object.keys(PC).forEach(k=>{node(s,...PC[k],k,{r:20,fill:k=='A'?A:k=='C'?B:null,stroke:A});txt(s,PC[k][0],PC[k][1]+36,'MAC '+mac[k],{'font-size':10})});
const r=el('rect',{x:H[0]-34,y:H[1]-22,width:68,height:44,rx:8,fill:'var(--card)',stroke:C,'stroke-width':2.5},s);txt(s,H[0],H[1]+5,cur,{'font-weight':700});if(cur=='Switch')txt(s,300,300,'MAC table: AA=port1  BB=port2  CC=port3  DD=port4',{'font-size':11})}
const say={Hub:'Hub sabko broadcast karta hai. B aur D ko bhi data mila, jabki unke liye tha hi nahi: traffic zyada, collision, insecure.',Switch:'Switch MAC address (CC) padh kar sirf C ko bhejta hai. Efficient, no collision.',Router:'Router do alag networks (LAN aur WAN) ko jodta hai aur packet ke liye best path chunta hai.',Gateway:'Gateway dissimilar networks ko jodta hai aur protocols translate karta hai. Dekho packet ka rang badal gaya.'};
names.forEach((n,i)=>bs.push(btn(n,()=>{if(busy)return;cur=n;pick(bs,i);draw();cap(say[n])},i==0)));
btn('A se C ko bhejo',async()=>{if(busy)return;busy=true;draw();cap('Sender A, Receiver C ...');
await pkt(s,[PC.A,H],{l:'C',dur:1100});
if(cur=='Hub'){el('circle',{cx:300,cy:160,r:34,class:'pulse',style:'stroke:var(--c);stroke-width:4'},s);await Promise.all(['B','C','D'].map(k=>pkt(s,[H,PC[k]],{l:'C',dur:1100,c:k=='C'?B:C})));['B','D'].forEach(k=>txt(s,PC[k][0],PC[k][1]-30,'mera nahi hai',{fill:C}).style.fill=C.replace('var(--c)','var(--c)'))}
else if(cur=='Gateway'){await pkt(s,[H,PC.C],{l:'C',dur:1100,c:'#7a5cc7'})}
else await pkt(s,[H,PC.C],{l:'C',dur:1100});
cap(say[cur]);busy=false});
draw();cap(say.Hub);ex('<b>Yaad rakho:</b> Hub = dumb, broadcast. Switch = intelligent, MAC address se unicast. Router = networks jodta hai, best path. Gateway = translator, entry/exit point. Repeater = weak signal ko amplify. Modem = analog &harr; digital. NIC = MAC address wala card.')}

/* 6. Switching */
function tSw(){const s=stage('Switching Techniques','Circuit switching vs Packet switching. Dono bhejo aur farak dekho.');defs([['Circuit switching','Data se pehle dedicated physical path set hota hai. Constant bandwidth, par chup rehne par resources waste.'],['Packet switching','Data chhote packets mein tootkar alag raaston se jaata hai aur destination par jud jaata hai.'],['Packet','Data ka chhota tukda: header (src, dst, seq no.) + data.'],['Router','Packets ke liye best path chunta hai.']]);
const S=[50,160],Rv=[550,160],P1=[200,70],P2=[200,250],Q1=[400,70],Q2=[400,250],Rt=[300,160];
function base(){s.innerHTML='';[[S,P1],[S,P2],[P1,Q1],[P2,Q2],[Q1,Rv],[Q2,Rv],[P1,Rt],[P2,Rt],[Rt,Q1],[Rt,Q2]].forEach(q=>line(s,q[0],q[1]));[P1,P2,Q1,Q2,Rt].forEach(p=>node(s,...p,'',{r:9}));node(s,...S,'S',{fill:A,r:20});node(s,...Rv,'R',{fill:B,r:20});txt(s,170,306,'Packet = Header (src, dst, seq no.) + Data',{'font-size':11})}
base();cap('Ek mode chuno aur bhejo.');
btn('Circuit switching',async()=>{if(busy)return;busy=true;hl(0);base();const p=[S,P1,Q1,Rv];for(let i=0;i<3;i++)line(s,p[i],p[i+1],{c:B,w:7});cap('Pehle ek dedicated path reserve hua. Poori call isi raaste se jaayegi, chahe koi bol raha ho ya chup ho.');
for(let i=0;i<4;i++)await pkt(s,p,{dur:900,z:6});cap('Constant bandwidth milti hai, par chup rehne par bhi path reserved rehta hai: resources waste. Example: purani telephone call.');busy=false});
btn('Packet switching',async()=>{if(busy)return;busy=true;hl(1);base();cap('Message 4 packets mein toota. Har packet alag raaste se, independently jaa raha hai.');
const col=['#2b8a3e','#7a5cc7','#c8423b','#0a7f73'],rt=[[S,P1,Q1,Rv],[S,P2,Q2,Rv],[S,P1,Rt,Q2,Rv],[S,P2,Rt,Q1,Rv]],du=[2400,3400,2000,3000];
for(let i=0;i<4;i++){el('rect',{x:400+i*36,y:292,width:30,height:22,rx:4,fill:'none',stroke:'var(--mut)','stroke-dasharray':'3 3'},s)}
const arr=[];await Promise.all(rt.map((r,i)=>pkt(s,r,{dur:du[i],c:col[i],l:i+1,z:11}).then(()=>{arr.push(i+1);const q=el('g',{},s);el('rect',{x:400+i*36,y:292,width:30,height:22,rx:4,fill:col[i]},q);txt(q,415+i*36,308,i+1,{}).style.fill='#fff';cap('Packets is order mein pahunche: '+arr.join(', ')+(arr.length==4?'. Destination par sahi order mein jod diye gaye (1-2-3-4). Bandwidth achhe se use hui: Internet isi tarah chalta hai.':'')) })));busy=false});
ex('<b>Exam point:</b> Circuit = dedicated path pehle se, constant bandwidth, resources waste. Packet = data chunks mein, independent path, robust aur efficient. Internet = packet switching.')}

/* 7. DNS */
function tDns(){const s=stage('URL, DNS aur Web','Jab tum website kholte ho to peeche kya hota hai? Step by step chalao.');defs([['URL','Uniform Resource Locator: web page ka unique address (protocol + domain + path).'],['DNS','Domain Name System: domain naam ko IP address mein badalta hai. Internet ki phonebook.'],['IP address','Network par device ka logical address. IPv4 = 32-bit, IPv6 = 128-bit.'],['HTTP / HTML','HTTP = web transfer ke rules (HTTPS = secure). HTML = page ka structure.']]);
const Br=[80,200],Dn=[300,60],Sv=[520,200];let st=0;const dom={'google.com':'142.250.190.46','example.com':'93.184.216.34'};
const sel=document.createElement('select');Object.keys(dom).forEach(d=>sel.add(new Option(d)));$('#c').appendChild(sel);
function base(){s.innerHTML='';line(s,Br,Dn);line(s,Dn,Sv);line(s,Br,Sv);node(s,...Br,'Browser',{r:32,fs:10});node(s,...Dn,'DNS',{r:30,fs:11,stroke:B});node(s,...Sv,'Server',{r:32,fs:10});txt(s,300,24,'DNS = Internet ki phonebook',{'font-weight':700});txt(s,80,248,'Web Client');txt(s,520,248,'Web Server (storage)')}
function url(){const d=sel.value;ex(`<b>URL (Uniform Resource Locator)</b> = page ka unique address:<br><code><span class="u">https://</span><span class="d">www.${d}</span><span class="p">/search</span></code><br><span class="u">Protocol</span> &nbsp; <span class="d">Domain name (IP mein badalta hai)</span> &nbsp; <span class="p">Path</span><br><b>Yaad rakho:</b> Internet = road, WWW = mall. HTTP = transport rules, HTML = page ka structure, DNS = naam se IP.`)}
sel.onchange=()=>{st=0;base();cap('Naya domain: '+sel.value+'. Agla step dabao.');url()};
btn('Agla step',async()=>{if(busy)return;busy=true;const d=sel.value,ip=dom[d];hl(st==0?1:st==1?2:3);
if(st==0){base();cap('Step 1: Tum '+d+' type karte ho. Browser DNS server se puchta hai: iska IP kya hai?');await pkt(s,[Br,Dn],{l:'?',dur:1500})}
else if(st==1){cap('Step 2: DNS lookup karke IP wapas deta hai: '+ip+'. Computer naam nahi, IP address samajhta hai.');await pkt(s,[Dn,Br],{l:'IP',dur:1500,c:A});txt(s,80,160,ip,{'font-weight':700})}
else if(st==2){cap('Step 3: Browser us IP wale server ko HTTP request bhejta hai.');await pkt(s,[Br,Sv],{l:'GET',dur:1800})}
else{cap('Step 4: Server HTML page wapas bhejta hai aur browser use screen par dikhata hai.');await pkt(s,[Sv,Br],{l:'HTML',z:12,dur:1800,c:'#2b8a3e'})}
st=(st+1)%4;busy=false});
base();cap('Agla step dabao.');url()}

const tabs=[['Network',tNet],['Types',tTypes],['Media',tMedia],['Topology',tTopo],['Devices',tDev],['Switching',tSw],['URL + DNS',tDns]];
const nav=$('#nav');
tabs.forEach(([n,f],i)=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>{[...nav.children].forEach(x=>x.setAttribute('aria-pressed',x==b));f()};nav.appendChild(b)});
nav.children[0].click();
</script></body></html>
